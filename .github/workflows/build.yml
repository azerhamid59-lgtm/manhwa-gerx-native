name: Build and Release Android App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm and Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 9
          node-version: 20
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Capacitor
        run: pnpm add -w @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build app
        run: pnpm run build

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Set App Version
        run: |
          sed -i 's/versionCode 1/versionCode 4/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.3"/g' android/app/build.gradle

      - name: Create Assets Directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Hide Native Scrollbar and Add SocialLogin (MainActivity)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/manhwagerx/app/MainActivity.kt
          package com.manhwagerx.app

          import android.content.Intent
          import android.os.Bundle
          import com.getcapacitor.BridgeActivity
          import com.getcapacitor.PluginHandle
          import com.getcapacitor.Plugin
          import ee.forgr.capacitor.social.login.GoogleProvider
          import ee.forgr.capacitor.social.login.SocialLoginPlugin
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin

          class MainActivity : BridgeActivity(), ModifiedMainActivityForSocialLoginPlugin {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  this.bridge.webView.setVerticalScrollBarEnabled(false)
                  this.bridge.webView.setHorizontalScrollBarEnabled(false)
                  
                  this.bridge.webView.postDelayed({
                      this.bridge.webView.evaluateJavascript(
                          "var style = document.createElement('style'); style.innerHTML = '::-webkit-scrollbar { display: none !important; width: 0px !important; height: 0px !important; background: transparent !important; } * { scrollbar-width: none !important; -ms-overflow-style: none !important; }'; document.head.appendChild(style);",
                          null
                      )
                  }, 1000)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      val pluginHandle: PluginHandle? = bridge.getPlugin("SocialLogin")
                      if (pluginHandle == null) {
                          android.util.Log.i("Google Activity Result", "SocialLogin login handle is null")
                          return
                      }
                      val plugin: Plugin? = pluginHandle.instance
                      if (plugin !is SocialLoginPlugin) {
                          android.util.Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin")
                          return
                      }
                      (plugin as SocialLoginPlugin).handleGoogleLoginIntent(requestCode, data)
                  }
              }

              override fun IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF

      - name: Set System Bars and Remove Scrollbar (Theme)
        run: |
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- الثيم الأساسي المفقود -->
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@null</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              
              <!-- الثيم المستخدم في التطبيق -->
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@null</item>
                  <item name="android:scrollbars">none</item>
                  <item name="android:scrollbarSize">0dp</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              
              <!-- ثيم شاشة البداية -->
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF

      - name: Disable Credential Manager
        run: |
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.credentials.API_ENABLED" android:value="false" />\n    <meta-data android:name="androidx.credentials.CREDENTIAL_SERVICE_ENABLED" android:value="false" />\n</application>|' android/app/src/main/AndroidManifest.xml

      - name: Generate Icons
        run: pnpm exec capacitor-assets generate --iconBackgroundColor "#FFFFFF"

      - name: Build Android app
        run: cd android && ./gradlew assembleDebug

      - name: Verify APK file
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./android/app/build/outputs/apk/debug/app-debug.apk
            ./android/app/build/outputs/apk/debug/output-metadata.json
