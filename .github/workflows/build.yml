name: Build and Release Android App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm and Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 9
          node-version: 20
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Capacitor
        run: pnpm add @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build app
        run: pnpm run build

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Set App Version
        run: |
          sed -i 's/versionCode 1/versionCode 3/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.3"/g' android/app/build.gradle

      - name: Hide Native Scrollbar
        run: |
          cat << 'EOF' > android/app/src/main/java/com/manhwagerx/app/MainActivity.kt
          package com.manhwagerx.app

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  bridge.webView.isVerticalScrollBarEnabled = false
              }
          }
          EOF

      - name: Set System Bars Color
        run: |
          sed -i 's/<item name="android:statusBarColor">.*<\/item>/<item name="android:statusBarColor">#000000<\/item>/g' android/app/src/main/res/values/styles.xml
          sed -i 's/<item name="android:navigationBarColor">.*<\/item>/<item name="android:navigationBarColor">#000000<\/item>/g' android/app/src/main/res/values/styles.xml

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Generate Icons
        run: pnpm exec capacitor-assets generate --iconBackgroundColor "#FFFFFF"

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build Android app
        run: cd android && ./gradlew assembleDebug

      - name: Verify APK file
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./android/app/build/outputs/apk/debug/app-debug.apk
            ./android/app/build/outputs/apk/debug/output-metadata.json
